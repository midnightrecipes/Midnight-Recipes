<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found | MIDNIGHT RECIPES</title>
<script>
/* GitHub Pages serves this file for any missing URL, at any depth, so work out the site root from the address. */
(function(){var p=location.pathname.split('/');var base=/\.github\.io$/.test(location.hostname)?'/'+p[1]+'/':'/';window.__base=base;
/* A recipe page that has not been generated yet (or failed to build) must never be a dead end: open the live version. */
var rest=location.pathname.slice(base.length).replace(/^\/+/,'');var rm=rest.match(/^recipes\/([a-z0-9-]+)\/?$/);
if(rm&&rm[1]!=='index'&&rm[1]!=='recipe'){location.replace(base+'recipes/recipe.html?slug='+rm[1]+'&live=1');return;}

var l=document.createElement('link');l.rel='stylesheet';l.href=base+'assets/css/style.css';document.head.appendChild(l);
var i=document.createElement('link');i.rel='icon';i.type='image/jpeg';i.href='/favicon.jpg';document.head.appendChild(i);})();
</script></head><body><main class="page"><div class="wrap"><section class="section"><h2 class="h2">Page not found</h2>
<p class="body-copy">This page doesn't exist — it may have been moved or renamed.</p>
<p class="body-copy"><a id="h" href="/">Home</a> &middot; <a id="a" href="/">View all recipes</a></p></section></div></main>
<script>document.getElementById('h').href=window.__base;document.getElementById('a').href=window.__base+'recipes/index.html';</script><script src="/assets/js/privacy-consent.js"></script></body></html>
