<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search — MIDNIGHT RECIPES</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><div id="site-header"></div><main><section class="section"><div class="wrap"><h1 class="h2">Search</h1><form class="search-form" id="searchPageForm" role="search" style="max-width:520px;margin-bottom:20px;"><label class="sr-only" for="searchPageInput">Search recipes</label><input id="searchPageInput" type="search" placeholder="Search recipes, source, cuisine, meal…" style="width:100%;"></form><p class="search-result-note" id="searchNote"></p><div class="grid" id="searchGrid"></div><p class="source-empty" id="emptyMsg" style="display:none;">No recipes found — try another search.</p></div></section></main><div id="site-footer"></div>
<script src="../assets/js/data.js"></script><script src="../assets/js/site.js"></script><script>
mountChrome("../");
const input=document.getElementById("searchPageInput"),grid=document.getElementById("searchGrid"),note=document.getElementById("searchNote"),empty=document.getElementById("emptyMsg");
input.value=qs("q")||"";
function render(){const q=input.value.trim(),matches=searchRecipes(q);grid.innerHTML="";matches.forEach(r=>grid.insertAdjacentHTML("beforeend",recipeCard(r,"../")));note.textContent=q?`${matches.length} recipe${matches.length===1?"":"s"} matching “${q}”`:"Search by recipe name, Source, Cuisine, Meal, The Usuals, or tags.";empty.style.display=matches.length?"none":"block";}
document.getElementById("searchPageForm").addEventListener("submit",e=>{e.preventDefault();history.replaceState({},"",`search.html?q=${encodeURIComponent(input.value.trim())}`);render();});
render();
</script></body></html>
