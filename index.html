<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT RECIPES</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="wrap">
      <h2 class="h2">By Source</h2>
      <div id="bySource"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2 class="h2">Latest Recipes</h2>
      <div class="grid" id="latestGrid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
  mountChrome("");

  const bySourceEl = document.getElementById("bySource");
  SOURCES.forEach(source => {
    const recipesForSource = latestFirst(RECIPES.filter(r => r.source === source));
    const block = document.createElement("div");
    block.className = "source-block";
    if (recipesForSource.length === 0) {
      block.innerHTML = `
        <h3><a href="recipes/by-source.html?src=${encodeURIComponent(source)}">${source}</a></h3>
        <p class="source-empty">No recipes here yet — check back soon.</p>`;
    } else {
      const latest = recipesForSource[0];
      block.innerHTML = `
        <h3><a href="recipes/by-source.html?src=${encodeURIComponent(source)}">${source}</a></h3>
        ${recipeCard(latest, "")}`;
    }
    bySourceEl.appendChild(block);
  });

  const latestGrid = document.getElementById("latestGrid");
  latestFirst(RECIPES).forEach(r => latestGrid.insertAdjacentHTML("beforeend", recipeCard(r, "")));
</script>
</body>
</html>
